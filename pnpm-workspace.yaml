packages:
  - "apps/*"
  - "packages/*"

overrides:
  three: "npm:super-three@0.185.0"

# Build Vite's esbuild binary and audiobus-protocol's TypeScript distribution.
allowBuilds:
  esbuild: true
  audiobus-protocol@https://codeload.github.com/designerzen/audiobus-protocol/tar.gz/59b008ff5930c257408af4faca15f2e3a4b7d5dc: true
  core-js: false
  leveldown: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false

# IWSDK's dev workspace (Runtime / Editor) imports its own dependencies by bare name from the
# app root. npm hoisted them; pnpm needs to be told to.
publicHoistPattern:
  - "@iwsdk/*"
  - "three-viewport-gizmo"
  - "preact"
  - "@preact/*"
  - "lucide"
  - "@zappar/*"
